<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="t d">
  <title id="t">Awesome Jev use cases</title>
  <desc id="d">A banner for a curated list of things built with Jev, showing the three question types Choice, Score and Noul.</desc>
  <style>@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes gl{0%,100%{opacity:.85}50%{opacity:1}}.card{animation:fl 4s ease-in-out infinite}.card2{animation:fl 4s ease-in-out -1.3s infinite}.card3{animation:fl 4s ease-in-out -2.6s infinite}</style><defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#141b3a"/>
      <stop offset="1" stop-color="#1d2a6b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fa8ff"/>
      <stop offset="1" stop-color="#3b6bf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#3b6bf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b6bf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="480" fill="url(#bg)"/>
  <rect width="1280" height="480" fill="url(#grid)"/>
  <rect width="1280" height="480" fill="url(#glow)"/>

  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="118" fill="#8fb4ff" font-size="20" font-weight="600" letter-spacing="3">A CURATED LIST</text>
    <text x="72" y="206" fill="#ffffff" font-size="88" font-weight="800" letter-spacing="-2">Awesome</text>
    <text x="72" y="296" fill="url(#accent)" font-size="88" font-weight="800" letter-spacing="-2">Jev use cases</text>
    <text x="72" y="346" fill="#c5cdea" font-size="26" font-weight="500">Things built with Jev, the limits nobody</text>
    <text x="72" y="380" fill="#c5cdea" font-size="26" font-weight="500">puts in the demo, and the receipts.</text>

    <g transform="translate(72 410)">
      <rect width="176" height="38" rx="19" fill="#ffffff" fill-opacity="0.10"/>
      <text x="88" y="25" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">74 demos, 37 repos</text>
      <rect x="190" width="250" height="38" rx="19" fill="#ffffff" fill-opacity="0.10"/>
      <text x="315" y="25" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">$0.042 per million input tokens</text>
      <rect x="454" width="132" height="38" rx="19" fill="#ffffff" fill-opacity="0.10"/>
      <text x="520" y="25" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">output is free</text>
    </g>

    <g transform="translate(700 78)" filter="url(#shadow)">
      <rect width="500" height="98" rx="18" fill="#ffffff"/>
      <text x="26" y="36" fill="#17181b" font-size="20" font-weight="800">Choice</text>
      <text x="474" y="36" text-anchor="end" fill="#6b7080" font-size="14">which one?</text>
      <rect x="26" y="52" width="300" height="14" rx="7" fill="#e9ebef"/>
      <rect x="26" y="52" width="216" height="14" rx="7" fill="#3b6bf6"/>
      <rect x="248" y="52" width="46" height="14" rx="0" fill="#8fb4ff"/>
      <rect x="298" y="52" width="28" height="14" rx="7" fill="#c9d8ff"/>
      <text x="26" y="88" fill="#6b7080" font-size="13">a probability for every option, not just a winner</text>
    </g>

    <g transform="translate(700 196)" filter="url(#shadow)">
      <rect width="500" height="98" rx="18" fill="#ffffff"/>
      <text x="26" y="36" fill="#17181b" font-size="20" font-weight="800">Score</text>
      <text x="474" y="36" text-anchor="end" fill="#6b7080" font-size="14">how much?</text>
      <rect x="26" y="58" width="448" height="6" rx="3" fill="#e9ebef"/>
      <circle cx="26" cy="61" r="4" fill="#c7cad1"/>
      <circle cx="250" cy="61" r="4" fill="#c7cad1"/>
      <circle cx="474" cy="61" r="4" fill="#c7cad1"/>
      <circle cx="322" cy="61" r="11" fill="#3b6bf6"/>
      <circle cx="322" cy="61" r="4.5" fill="#ffffff"/>
      <text x="26" y="88" fill="#6b7080" font-size="13">lands between levels, weighted by probability</text>
    </g>

    <g transform="translate(700 314)" filter="url(#shadow)">
      <rect width="500" height="98" rx="18" fill="#ffffff"/>
      <text x="26" y="36" fill="#17181b" font-size="20" font-weight="800">Noul</text>
      <text x="474" y="36" text-anchor="end" fill="#6b7080" font-size="14">yes or no?</text>
      <rect x="26" y="52" width="448" height="14" rx="7" fill="#e9ebef"/>
      <rect x="26" y="52" width="380" height="14" rx="7" fill="#1fa971"/>
      <text x="26" y="88" fill="#6b7080" font-size="13">one probability, and no text generated</text>
    </g>
  </g>
</svg>
